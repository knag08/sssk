<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #f0f0f0;
        }

        #pdfRenderer {
            border: 1px solid #ccc;
            margin-top: 20px;
            max-width: 100%;
        }

        .controls {
            margin-top: 10px;
            display: none; /* Initially hidden */
            align-items: center; /* Align items horizontally */
        }

        button {
            margin: 5px;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 18px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
        }

        span {
            margin: 0 10px;
            font-size: 18px;
        }

        .loading {
            font-size: 20px;
            margin-top: 20px;
            display: none;
        }

        /* Mobile responsive styles */
        @media screen and (max-width: 600px) {
            button {
                padding: 12px 15px;
                font-size: 16px;
            }

            span {
                font-size: 16px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
</head>
<body>

<canvas id="pdfRenderer"></canvas>

<div class="controls" id="controls">
    <button onclick="prevPage()">&#8592;</button>
    <span>Page: <span id="pageNum"></span></span>
    <button onclick="nextPage()">&#8594;</button>
</div>

<div class="loading" id="loadingIndicator">Loading...</div>

<script>
    let pdfDoc = null;
    let pageNum = 1;
    const scale = 1.5;
    const canvas = document.getElementById('pdfRenderer');
    const ctx = canvas.getContext('2d');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const controls = document.getElementById('controls');

    function showLoadingIndicator() {
        loadingIndicator.style.display = 'block';
    }

    function hideLoadingIndicator() {
        loadingIndicator.style.display = 'none';
    }

    function showControls() {
        controls.style.display = 'flex';
    }

    function renderPage(num) {
        showLoadingIndicator();
        pdfDoc.getPage(num).then(function(page) {
            console.log('Page loaded:', num);
            
            const viewport = page.getViewport({ scale: scale });
            canvas.height = viewport.height + 50;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };

            return page.render(renderContext);
        }).then(function() {
            hideLoadingIndicator();
            showControls(); // Show controls after rendering is done
        }).catch(function(error) {
            console.error('Error rendering the page:', error);
            hideLoadingIndicator();
        });

        document.getElementById('pageNum').textContent = pageNum;
    }

    function loadPDF() {
        const urlParams = new URLSearchParams(window.location.search);
        const pdfUrl = urlParams.get('pdf');
        pageNum = parseInt(urlParams.get('page')) || 1;

        console.log('Loading PDF:', pdfUrl);
        console.log('Navigating to page:', pageNum);

        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
            console.log('PDF loaded:', pdf);
            pdfDoc = pdf;
            renderPage(pageNum);
        }).catch(function(error) {
            console.error('Error loading the PDF:', error);
            hideLoadingIndicator();
        });
    }

    function prevPage() {
        if (pageNum <= 1) {
            return;
        }
        pageNum--;
        renderPage(pageNum);
    }

    function nextPage() {
        if (pageNum >= pdfDoc.numPages) {
            return;
        }
        pageNum++;
        renderPage(pageNum);
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('pdf') && urlParams.has('page')) {
        loadPDF();
    }
</script>

</body>
</html>
